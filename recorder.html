<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UT E-Learning - Perekam Kamera</title>
  <style>
    :root {
      --bg-color: #0f1714;
      --surface-color: #1a241f;
      --primary-color: #2E8B57;
      --primary-hover: #32CD32;
      --danger-color: #dc143c;
      --danger-hover: #ff4040;
      --text-main: #f0f4f2;
      --text-muted: #8b9c94;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--surface-color);
      border-radius: 16px;
      padding: 15px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror effect */
    }

    .recording-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .recording-indicator.active {
      opacity: 1;
    }

    .red-dot {
      width: 10px;
      height: 10px;
      background-color: var(--danger-color);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    .timer {
      font-family: monospace;
      font-size: 14px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    #startCamera {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #startCamera:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
    }

    #startRecord {
      background: var(--primary-color);
      color: white;
    }
    #startRecord:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    #stopRecord {
      background: var(--danger-color);
      color: white;
    }
    #stopRecord:hover:not(:disabled) {
      background: var(--danger-hover);
      transform: translateY(-2px);
    }

    .privacy-notice {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .privacy-notice strong {
      color: var(--primary-color);
    }

    .bg-controls, .device-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 10px;
    }
    
    .device-controls select {
      max-width: 250px;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    select, input[type="file"] {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
      outline: none;
    }

    select:focus {
      border-color: var(--primary-color);
    }
    
    select option {
      background: var(--surface-color);
      color: var(--text-main);
    }
    
    #bgImageInput {
      display: none;
    }
    
    .custom-file-upload {
      display: none;
      padding: 10px 15px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .custom-file-upload:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    canvas.mirrored {
      transform: scaleX(-1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Perekam Kamera Offline</h1>
      <p>Rekaman diproses dan disimpan sepenuhnya di perangkat Anda.</p>
    </div>

    <div class="device-controls" style="display: none;">
      <label for="cameraSelect" style="font-size: 14px; font-weight: 600;">📹 Kamera:</label>
      <select id="cameraSelect"></select>
      
      <label for="micSelect" style="font-size: 14px; font-weight: 600; margin-left: 10px;">🎤 Mikrofon:</label>
      <select id="micSelect"></select>
    </div>

    <div class="bg-controls">
      <label for="bgMode" style="font-size: 14px; font-weight: 600;">Latar Belakang:</label>
      <select id="bgMode">
        <option value="normal">Normal</option>
        <option value="blur">Blur Latar Belakang</option>
        <option value="image">Gambar Kustom</option>
      </select>
      <label for="bgImageInput" id="uploadBtn" class="custom-file-upload">
        🖼️ Pilih Gambar
      </label>
      <input type="file" id="bgImageInput" accept="image/png, image/jpeg, image/jpg">
      <span id="bgWarning" style="display: none; font-size: 11px; color: #ffb84d; font-weight: 600; max-width: 150px; line-height: 1.2;">Peringatan: Gambar tidak disimpan permanen</span>
    </div>

    <div class="video-container">
      <video id="preview" autoplay muted playsinline style="position: absolute; width: 1px; height: 1px; visibility: hidden;"></video>
      <canvas id="outputCanvas" width="1280" height="720" class="mirrored"></canvas>
      <div class="recording-indicator" id="recordingIndicator">
        <div class="red-dot"></div>
        <span class="timer" id="timerDisplay">00:00</span>
      </div>
    </div>

    <div class="controls">
      <button id="toggleFlip" title="Flip Preview" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2);">🪞</button>
      <button id="startCamera" title="Nyalakan Kamera">📸</button>
      <button id="startRecord" title="Mulai Merekam" disabled>🔴</button>
      <button id="stopRecord" title="Berhenti Merekam" disabled>⏹</button>
    </div>

    <div class="privacy-notice">
      🔒 <strong>Bio-Digital Privacy:</strong> Video Anda sama sekali <strong>tidak dikirim ke server mana pun</strong>. Setelah berhenti, file langsung diunduh ke PC Anda secara lokal.
    </div>
  </div>

  <!-- Load MediaPipe Selfie Segmentation -->
  <script src="lib/selfie_segmentation/camera_utils.js"></script>
  <script src="lib/selfie_segmentation/selfie_segmentation.js"></script>
  
  <script src="recorder.js"></script>
</body>
</html>
